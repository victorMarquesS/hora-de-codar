<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bichinho Virtual - LoL Edition</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <h1>Escolha seu Campeão</h1>
        
        <div id="tela-selecao" class="selecao">
            <div class="card-personagem" onclick="iniciarJogo('Garen')">
                <img src="https://ddragon.leagueoflegends.com/cdn/14.4.1/img/champion/Garen.png" alt="Garen"><p>Garen</p>
            </div>
            <div class="card-personagem" onclick="iniciarJogo('Katarina')">
                <img src="https://ddragon.leagueoflegends.com/cdn/14.4.1/img/champion/Katarina.png" alt="Katarina"><p>Katarina</p>
            </div>
            <div class="card-personagem" onclick="iniciarJogo('Zed')">
                <img src="https://ddragon.leagueoflegends.com/cdn/14.4.1/img/champion/Zed.png" alt="Zed"><p>Zed</p>
            </div>
            <div class="card-personagem" onclick="iniciarJogo('Riven')">
                <img src="https://ddragon.leagueoflegends.com/cdn/14.4.1/img/champion/Riven.png" alt="Riven"><p>Riven</p>
            </div>
        </div>

        <div id="tela-jogo">
            <h2 id="nome-pet"></h2>
            <p id="descricao-pet" class="descricao"></p>
            
            <div class="avatar-container">
                <img id="avatar-pet" class="avatar" src="" alt="Pet">
            </div>

            <div class="status-barras">
                <div class="barra-grupo">
                    <label><span>Fome</span> <span id="txt-fome">0/100</span></label>
                    <div class="barra-fundo"><div id="barra-fome" class="barra-preenchimento" style="width: 50%;"></div></div>
                </div>
                <div class="barra-grupo">
                    <label><span>Felicidade</span> <span id="txt-felicidade">0/100</span></label>
                    <div class="barra-fundo"><div id="barra-felicidade" class="barra-preenchimento" style="width: 50%;"></div></div>
                </div>
                <div class="barra-grupo">
                    <label><span>Cansaço</span> <span id="txt-cansaco">0/100</span></label>
                    <div class="barra-fundo"><div id="barra-cansaco" class="barra-preenchimento" style="width: 0%;"></div></div>
                </div>
                <div class="barra-grupo">
                    <label><span>Idade</span> <span id="txt-idade">0 anos</span></label>
                </div>
            </div>

            <!-- NOVO PAINEL DE PREVISÕES -->
            <div class="painel-previsao">
                <div class="previsao-item">
                    <strong>⏳ Passar Tempo (Custo)</strong>
                    <span id="txt-custo-tempo">Carregando...</span>
                </div>
                <div class="previsao-acoes">
                    <span>🍖 Alimentar: <strong id="txt-custo-alimentar">-25 Fome</strong></span>
                    <span>🎾 Brincar: <strong id="txt-custo-brincar">+X Fel / +15 Cans</strong></span>
                    <span>💤 Descansar: <strong id="txt-custo-descansar">-X Cans</strong></span>
                </div>
            </div>

            <div class="acoes-container">
                Ações neste turno: <span id="txt-acoes">2 / 2</span>
            </div>

            <div class="botoes">
                <button id="btn-alimentar" onclick="acao('alimentar')">🍖 Alimentar</button>
                <button id="btn-brincar" onclick="acao('brincar')">🎾 Brincar</button>
                <button id="btn-descansar" onclick="acao('descansar')">💤 Descansar</button>
                <button id="btn-tempo" class="btn-passar" onclick="acao('passarTempo')">⏳ Passar Tempo</button>
            </div>

            <button id="btn-reiniciar" class="btn-reiniciar" onclick="reiniciarJogo()">Voltar ao Menu</button>

            <div id="log"><p>Jogo iniciado. Cuide bem do seu campeão!</p></div>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
